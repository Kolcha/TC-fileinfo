name: Build Windows Library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }} - ${{ matrix.platform }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Release_dynMFC]
        platform: [Win32, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build FileInfo plugin
        shell: pwsh
        run: |
          msbuild src\wincmd\fileinfo\fileinfo.sln `
            /m `
            /t:Build `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:VisualStudioVersion=17.0 `
            /verbosity:minimal

      - name: Build unaspack DLL
        shell: pwsh
        run: |
          msbuild src\wincmd\unaspack\unaspack.sln `
            /m `
            /t:Build `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:VisualStudioVersion=17.0 `
            /verbosity:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: FileInfo-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            **/${{ matrix.configuration }}/**/*.dll
            **/${{ matrix.configuration }}/**/*.dll64
            **/${{ matrix.configuration }}/**/*.wlx
            **/${{ matrix.configuration }}/**/*.wlx64
          if-no-files-found: warn
